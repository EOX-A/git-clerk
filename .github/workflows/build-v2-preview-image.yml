# TEMPORARY WORKFLOW: Automatically builds and pushes a pre-merge v2 preview
# Docker image on pushes to `feat/git-clerk-v2` for cluster testing without
# going through `release-please`.
# Delete this file once v2 is merged to `main`.

name: Build v2 Preview Docker Image

on:
  push:
    branches:
      - feat/git-clerk-v2

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push v2 preview image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build v2 bundle
        run: npm run build:v2

      - name: Resolve checked-out commit SHA
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "FULL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -t "ghcr.io/eox-a/git-clerk:v2-${SHORT_SHA}" .

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Push Docker image
        run: docker push "ghcr.io/eox-a/git-clerk:v2-${SHORT_SHA}"

      - name: Write job summary
        env:
          CHECKOUT_REF: ${{ github.ref_name }}
        run: |
          IMAGE_REF="ghcr.io/eox-a/git-clerk:v2-${SHORT_SHA}"
          {
            echo "### v2 Preview Docker Image"
            echo ""
            echo "- **Image:** \`${IMAGE_REF}\`"
            echo "- **Ref:** \`${CHECKOUT_REF}\`"
            echo "- **Commit:** \`${FULL_SHA}\` (\`${SHORT_SHA}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
